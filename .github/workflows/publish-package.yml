name: Publicar librería

on:
  push:
    tags:
      - 'ds-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@iamacalupuenzo-ui'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Validar documentación y ejemplos
        run: npm run check:docs

      - name: Compilar librería
        run: npm run build:lib

      - name: Ejecutar pruebas unitarias
        run: npm run test:ci

      - name: Compilar Storybook
        run: npm run build-storybook

      - name: Verificar agent readiness
        run: npx --yes adsa-cli@0.1.5 audit --gate

      - name: Verificar versión del tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./projects/comsatel-ds/package.json').version")"
          test "ds-v${PACKAGE_VERSION}" = "$GITHUB_REF_NAME"

      - name: Publicar paquete
        working-directory: dist/comsatel-ds
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
