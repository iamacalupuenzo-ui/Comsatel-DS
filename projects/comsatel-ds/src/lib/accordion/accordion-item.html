<button
  #header
  type="button"
  class="cs-accordion-item__header"
  [attr.id]="domId + '-header'"
  [disabled]="disabled"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="domId + '-body'"
  (click)="onHeaderClick()"
  (keydown)="onHeaderKeydown($event)"
>
  <div class="cs-accordion-item__header-content">
    <ng-content select="[header]"></ng-content>
  </div>
  <cs-icon
    name="chevron-right"
    [size]="15"
    class="cs-accordion-item__chevron"
    [class.cs-accordion-item__chevron--open]="expanded()"
    aria-hidden="true"
  />
</button>
<div
  class="cs-accordion-item__body"
  #body
  role="region"
  [attr.id]="domId + '-body'"
  [attr.aria-labelledby]="domId + '-header'"
  [attr.aria-hidden]="!expanded()"
  [attr.inert]="expanded() ? null : ''"
>
  <div class="cs-accordion-item__body-inner">
    <ng-content></ng-content>
  </div>
</div>
