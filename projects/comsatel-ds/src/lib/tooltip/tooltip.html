<span class="cs-tooltip__trigger">
  <ng-content></ng-content>
</span>
<span [id]="tooltipId" [class]="'cs-tooltip__popup cs-tooltip__popup--' + side" [ngStyle]="popupStyle" role="tooltip">
  {{ content }}
  @if (arrow) {
    <span [class]="'cs-tooltip__arrow cs-tooltip__arrow--' + side" aria-hidden="true"></span>
  }
</span>
