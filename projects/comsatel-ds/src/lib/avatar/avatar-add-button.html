<button
  type="button"
  class="cs-avatar-add"
  [class.cs-avatar-add--force-hover]="forceHover"
  [class.cs-avatar-add--force-focus]="forceFocus"
  [style.width]="sizeValue"
  [style.height]="sizeValue"
  [attr.aria-label]="ariaLabel"
  [disabled]="disabled"
  (click)="addClick.emit()"
>
  <cs-icon name="plus" [size]="iconPx"></cs-icon>
</button>
