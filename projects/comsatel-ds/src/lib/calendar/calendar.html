<div class="cs-calendar">
  <div class="cs-calendar__header">
    <div class="cs-calendar__nav-group">
      <button
        type="button"
        class="cs-calendar__nav-btn"
        aria-label="Año anterior"
        (click)="shiftYear(-1)"
      >
        <cs-icon name="chevrons-left" [size]="14"></cs-icon>
      </button>
      <button
        type="button"
        class="cs-calendar__nav-btn"
        aria-label="Mes anterior"
        (click)="shiftMonth(-1)"
      >
        <cs-icon name="chevron-left" [size]="14"></cs-icon>
      </button>
    </div>

    <span class="cs-calendar__label" [ngStyle]="labelStyle()" aria-live="polite">{{ label() }}</span>

    <div class="cs-calendar__nav-group">
      <button
        type="button"
        class="cs-calendar__nav-btn"
        aria-label="Mes siguiente"
        (click)="shiftMonth(1)"
      >
        <cs-icon name="chevron-right" [size]="14"></cs-icon>
      </button>
      <button
        type="button"
        class="cs-calendar__nav-btn"
        aria-label="Año siguiente"
        (click)="shiftYear(1)"
      >
        <cs-icon name="chevrons-right" [size]="14"></cs-icon>
      </button>
    </div>
  </div>

  <div class="cs-calendar__weekdays" role="row">
    @for (w of weekdays(); track w) {
      <span class="cs-calendar__weekday" role="columnheader" [ngStyle]="weekdayStyle">{{ w }}</span>
    }
  </div>

  <div
    class="cs-calendar__grid"
    role="grid"
    [attr.aria-label]="ariaLabelledby() ? null : ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby() || null"
    aria-rowcount="6"
    aria-colcount="7"
  >
    @for (week of weeks(); track $index) {
      <div class="cs-calendar__week" role="row">
        @for (cell of week; track cell.iso) {
          <div
            class="cs-calendar__cell"
            role="gridcell"
            [attr.aria-label]="dayAriaLabel(cell)"
            [attr.aria-selected]="isSelected(cell.iso) || isRangeEdge(cell.iso)"
            [attr.aria-disabled]="isDisabled(cell.iso) ? 'true' : null"
            [ngStyle]="cellStyle(cell)"
          >
            <button
              type="button"
              class="cs-calendar__day"
              [attr.data-calendar-day]="cell.iso"
              [disabled]="isDisabled(cell.iso)"
              [attr.aria-label]="dayAriaLabel(cell)"
              [attr.aria-current]="isToday(cell.iso) ? 'date' : null"
              [tabIndex]="dayTabIndex(cell)"
              [ngStyle]="dayStyle(cell)"
              (click)="onDayClick(cell)"
              (focus)="onDayFocus(cell.iso)"
              (keydown)="onDayKeydown($event, cell)"
              (mouseenter)="hoveredIso.set(cell.iso)"
              (mouseleave)="hoveredIso.set(null)"
            >{{ cell.day }}</button>
          </div>
        }
      </div>
    }
  </div>
</div>
