@if (rendered()) {
  <div
    #panel
    [id]="id"
    [attr.role]="role"
    [attr.aria-label]="ariaLabel"
    [attr.aria-labelledby]="ariaLabelledBy"
    class="cs-popover"
    [class.cs-popover--visible]="visible()"
    [class.cs-popover--bare]="bare"
    [style.top.px]="pos()?.top ?? -9999"
    [style.left.px]="pos()?.left ?? -9999"
    [style.width.px]="pos()?.width ?? null"
    [style.visibility]="pos() ? 'visible' : 'hidden'"
  >
    <ng-content></ng-content>
  </div>
}
