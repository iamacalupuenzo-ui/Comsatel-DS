<header class="cs-header">
  <span class="cs-header__brand">{{ brand }}</span>
  <div class="cs-header__actions">
    <button type="button" class="cs-header__icon-button" aria-label="Notificaciones" (click)="notificationsClick.emit()"><cs-icon name="bell" [size]="18" aria-hidden="true" />@if (notificationCount > 0) { <span class="cs-header__notification" [attr.aria-label]="notificationCount + ' notificaciones'">{{ notificationCount > 99 ? '99+' : notificationCount }}</span> }</button>
    <button #userTrigger type="button" class="cs-header__user-trigger" aria-haspopup="menu" aria-controls="header-account-menu" [attr.aria-expanded]="menuOpen" (click)="toggleMenu()"><cs-avatar size="sm" [src]="user.avatarSrc" [initials]="user.initials" [alt]="user.name" /><span class="cs-header__user-copy"><span>{{ user.name }}</span><small>{{ user.role }}</small></span><cs-icon name="chevron-down" [size]="16" aria-hidden="true" /></button>
  </div>
</header>
<cs-popover [isOpen]="menuOpen" [triggerRef]="trigger()" placement="bottom-end" role="menu" ariaLabel="Menú de usuario" (closed)="closeMenu()"><div id="header-account-menu" class="cs-header__menu"><div class="cs-header__menu-user"><strong>{{ user.name }}</strong><span>{{ user.role }}</span></div><div class="cs-header__menu-divider" role="separator"></div><button type="button" role="menuitem" (click)="settings()"><cs-icon name="settings" [size]="16" aria-hidden="true" />Configuración</button><div class="cs-header__menu-divider" role="separator"></div><button type="button" class="cs-header__menu-logout" role="menuitem" (click)="logout()"><cs-icon name="log-out" [size]="16" aria-hidden="true" />Cerrar sesión</button></div></cs-popover>
