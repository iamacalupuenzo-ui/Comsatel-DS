<input
  [id]="resolvedId"
  class="cs-input-group-input"
  data-slot="input-group-control"
  [attr.data-field-size]="fieldSize"
  [attr.type]="type"
  [placeholder]="placeholder"
  [disabled]="disabled"
  [attr.aria-invalid]="invalid ? 'true' : null"
  [attr.aria-required]="required ? 'true' : null"
  [attr.aria-haspopup]="ariaHasPopup ?? null"
  [attr.aria-expanded]="ariaExpanded === undefined ? null : ariaExpanded"
  [attr.aria-controls]="ariaControls ?? null"
  [style.height.px]="tok.height"
  [style.font-size]="tok.fontSize"
  [style.line-height]="tok.lineHeight"
  [value]="value"
  (input)="onInput($any($event.target).value)"
  (focus)="focused.emit()"
  (blur)="blurred.emit()"
  (keydown.enter)="enterKey.emit()"
  (keydown.escape)="escapeKey.emit()"
/>
