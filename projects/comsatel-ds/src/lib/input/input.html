<input
  [id]="inputId"
  class="cs-input"
  [attr.data-field-size]="fieldSize"
  [attr.type]="type"
  [placeholder]="placeholder"
  [disabled]="disabled"
  [attr.aria-invalid]="invalid ? 'true' : null"
  [style.height.px]="tok.height"
  [style.padding-inline.px]="tok.paddingInline"
  [style.font-size]="tok.fontSize"
  [style.line-height]="tok.lineHeight"
  [value]="value"
  (input)="onInput($any($event.target).value)"
/>
