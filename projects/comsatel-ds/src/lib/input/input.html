<input
  [id]="resolvedId"
  class="cs-input"
  [attr.data-field-size]="fieldSize"
  [attr.type]="type"
  [attr.name]="name || null"
  [placeholder]="placeholder"
  [attr.autocomplete]="autocomplete || null"
  [required]="required"
  [attr.aria-required]="required ? 'true' : null"
  [readonly]="readonly"
  [disabled]="disabled"
  [attr.aria-invalid]="invalid ? 'true' : null"
  [attr.aria-label]="ariaLabel || null"
  [attr.aria-labelledby]="ariaLabelledby || null"
  [attr.aria-describedby]="ariaDescribedby || null"
  [attr.aria-errormessage]="ariaErrormessage || null"
  [attr.min]="min ?? null"
  [attr.max]="max ?? null"
  [attr.step]="step ?? null"
  [style.height.px]="tok.height"
  [style.padding-inline.px]="tok.paddingInline"
  [style.font-size]="tok.fontSize"
  [style.line-height]="tok.lineHeight"
  [value]="value"
  (input)="onInput($any($event.target).value)"
/>
