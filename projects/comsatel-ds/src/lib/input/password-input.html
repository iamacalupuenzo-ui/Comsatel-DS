<cs-input-group>
  @if (leadingIcon) {
    <cs-input-group-addon>
      <cs-icon [name]="leadingIcon" [size]="16" aria-hidden="true"></cs-icon>
    </cs-input-group-addon>
  }
  <cs-input-group-input
    [fieldSize]="fieldSize"
    [id]="id"
    [name]="name"
    [type]="visible() ? 'text' : 'password'"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [required]="required"
    [readonly]="readonly"
    [disabled]="disabled"
    [invalid]="invalid"
    [aria-label]="ariaLabel"
    [aria-labelledby]="ariaLabelledby"
    [aria-describedby]="ariaDescribedby"
    [aria-errormessage]="ariaErrormessage"
    [value]="value"
    (valueChange)="onInput($event)"
  ></cs-input-group-input>
  <cs-input-group-addon align="inline-end">
    <button
      type="button"
      class="cs-input-group-icon-button"
      [disabled]="disabled"
      [attr.aria-label]="visible() ? hidePasswordLabel : showPasswordLabel"
      [attr.aria-pressed]="visible()"
      (click)="toggleVisibility()"
    >
      <cs-icon [name]="visible() ? 'eye-off' : 'eye'" [size]="16" aria-hidden="true"></cs-icon>
    </button>
  </cs-input-group-addon>
</cs-input-group>
