<div
  class="cs-input-group-addon"
  [class.cs-input-group-addon--start]="align === 'inline-start'"
  [class.cs-input-group-addon--end]="align === 'inline-end'"
  [class.cs-input-group-addon--compact]="compact"
  [class.cs-input-group-addon--divider]="divider"
  (click)="onClick($event)"
>
  <ng-content></ng-content>
</div>
