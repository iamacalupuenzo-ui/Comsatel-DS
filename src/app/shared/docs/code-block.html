<div class="code-block">
  <cs-button class="code-block__copy" variant="default" size="xs" (click)="copy()">
    @if (copied()) {
      <cs-icon name="check" [size]="12"></cs-icon>
      <span>Copiado</span>
    } @else {
      <cs-icon name="copy" [size]="12"></cs-icon>
      <span>Copiar</span>
    }
  </cs-button>
  <pre class="code-block__pre" [innerHTML]="highlightedCode()"></pre>
</div>
