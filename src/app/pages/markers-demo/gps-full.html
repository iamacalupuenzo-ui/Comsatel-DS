<div class="gps-full-wrap">
  <button type="button" class="gps-full" aria-label="Dispositivo GPS SVR Plus, en línea a las 14:32, mostrar detalle">
    <div class="gps-full__icon-wrap">
      <cs-icon name="satellite" [size]="20" />
    </div>
    <div class="gps-full__text">
      <span class="gps-full__label">SVR Plus</span>
      <div class="gps-full__meta">
        <span class="gps-full__time">14:32</span>
        <div class="gps-full__status">
          <div class="gps-full__status-dot"></div>
          <span class="gps-full__status-label">Online</span>
        </div>
      </div>
    </div>
  </button>
  <div class="gps-full__stem-line"></div>
  <div class="gps-full__stem-dot"></div>
</div>
