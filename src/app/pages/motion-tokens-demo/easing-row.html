<div class="row-card">
  <div class="row-card__track">
    <div #dot class="row-card__dot"></div>
  </div>
  <div class="row-card__body">
    <div class="row-card__head">
      <code class="row-card__token">{{ token }}</code>
    </div>
    <code class="row-card__curve">{{ curve }}</code>
    <p class="row-card__desc">{{ description }}</p>
  </div>
  <div class="row-card__actions">
    <button type="button" class="row-card__replay" (click)="replay()" [attr.aria-label]="'Repetir animación de ' + token">Repetir</button>
  </div>
</div>
